name: Tailscale-RDP

on:
  workflow_dispatch:

concurrency:
  group: tailscale-rdp-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      RDP_USERNAME: egandika
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_HOSTNAME: gh-rdp-${{ github.run_id }}

    steps:
      - name: Validate secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Secret RDP_PASSWORD belum dibuat."
          }

          if ($env:RDP_PASSWORD.Length -lt 16) {
            throw "RDP_PASSWORD minimal 16 karakter."
          }

          if ($env:RDP_PASSWORD -notmatch '[A-Z]') {
            throw "RDP_PASSWORD harus memiliki huruf besar."
          }

          if ($env:RDP_PASSWORD -notmatch '[a-z]') {
            throw "RDP_PASSWORD harus memiliki huruf kecil."
          }

          if ($env:RDP_PASSWORD -notmatch '\d') {
            throw "RDP_PASSWORD harus memiliki angka."
          }

          if ($env:RDP_PASSWORD -notmatch '[^a-zA-Z0-9]') {
            throw "RDP_PASSWORD harus memiliki simbol."
          }

          if ($env:RDP_PASSWORD -match 'egandika') {
            throw "RDP_PASSWORD tidak boleh mengandung username."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Secret TAILSCALE_AUTH_KEY belum dibuat."
          }

      - name: Configure RDP and firewall
        shell: pwsh
        run: |
          $terminalServerPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpTcpPath = "$terminalServerPath\WinStations\RDP-Tcp"
          $firewallRuleName = "RDP-Tailscale-Only"

          # Aktifkan Remote Desktop
          Set-ItemProperty `
            -Path $terminalServerPath `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          # Aktifkan Network Level Authentication
          Set-ItemProperty `
            -Path $rdpTcpPath `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          # Nonaktifkan rule RDP bawaan Windows
          $defaultRdpRules = Get-NetFirewallRule `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.DisplayGroup -eq "Remote Desktop"
            }

          if ($defaultRdpRules) {
            $defaultRdpRules |
              Disable-NetFirewallRule `
              -ErrorAction SilentlyContinue
          }

          # Hapus rule custom jika sudah ada
          Remove-NetFirewallRule `
            -DisplayName $firewallRuleName `
            -ErrorAction SilentlyContinue

          # Izinkan RDP hanya dari alamat IPv4 Tailscale
          New-NetFirewallRule `
            -DisplayName $firewallRuleName `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any

          Restart-Service `
            -Name TermService `
            -Force

      - name: Create RDP user
        shell: pwsh
        run: |
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          # SID S-1-5-32-555 adalah grup Remote Desktop Users
          $rdpGroup = Get-LocalGroup `
            -SID "S-1-5-32-555" `
            -ErrorAction Stop

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {
            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "Temporary RDP user"
          }
          else {
            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePassword

            Enable-LocalUser `
              -Name $env:RDP_USERNAME
          }

          # Pastikan user aktif
          Enable-LocalUser `
            -Name $env:RDP_USERNAME

          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction Stop

          $members = Get-LocalGroupMember `
            -Group $rdpGroup.Name `
            -ErrorAction SilentlyContinue

          $isMember = @(
            $members | Where-Object {
              $_.SID.Value -eq $user.SID.Value
            }
          ).Count -gt 0

          if (-not $isMember) {
            Add-LocalGroupMember `
              -Group $rdpGroup.Name `
              -Member $env:RDP_USERNAME
          }

          Write-Host "User RDP siap digunakan."
          Write-Host "Username: $env:RDP_USERNAME"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "tailscale-setup.msi"

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile $installer

          # Validasi signature installer
          $signature = Get-AuthenticodeSignature `
            -FilePath $installer

          if ($signature.Status -ne "Valid") {
            throw "Signature installer Tailscale tidak valid."
          }

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList @(
              "/i",
              $installer,
              "/qn",
              "/norestart"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Instalasi Tailscale gagal. Exit code: $($process.ExitCode)"
          }

      - name: Connect Tailscale
        shell: pwsh
        run: |
          $tailscaleCandidates = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          $tailscale = $tailscaleCandidates |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (-not $tailscale) {
            throw "tailscale.exe tidak ditemukan."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Secret TAILSCALE_AUTH_KEY belum dibuat."
          }

          & $tailscale up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$env:TAILSCALE_HOSTNAME" `
            "--accept-dns=false" `
            "--accept-routes=false" `
            "--advertise-tags=tag:tag-test1"

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal menghubungkan Tailscale."
          }

          # Hapus auth key dari environment setelah digunakan
          Remove-Item `
            Env:TAILSCALE_AUTH_KEY `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $statusJson = & $tailscale status --json

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal membaca status Tailscale."
          }

          $status = (
            $statusJson -join "`n"
          ) | ConvertFrom-Json

          if ($status.BackendState -ne "Running") {
            throw "Status Tailscale bukan Running: $($status.BackendState)"
          }

          $ipLine = & $tailscale ip -4 |
            Select-Object -First 1

          $ip = if ($null -ne $ipLine) {
            "$ipLine".Trim()
          }
          else {
            ""
          }

          if ($ip -notmatch '^\d{1,3}(\.\d{1,3}){3}$') {
            throw "IP Tailscale IPv4 tidak valid atau tidak ditemukan."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP SIAP DIGUNAKAN"
          Write-Host "Hostname : $env:TAILSCALE_HOSTNAME"
          Write-Host "IP       : $ip"
          Write-Host "Port     : 3389"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : gunakan secret RDP_PASSWORD"
          Write-Host "======================================"
          Write-Host ""

      - name: Verify RDP listener
        shell: pwsh
        run: |
          $service = Get-Service `
            -Name TermService `
            -ErrorAction Stop

          if ($service.Status -ne "Running") {
            throw "Windows Remote Desktop Service tidak berjalan."
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            throw "RDP tidak sedang listen pada port 3389."
          }

          Write-Host "TermService berjalan."
          Write-Host "Port TCP 3389 sedang listen."

      - name: Keep runner alive
        shell: pwsh
        run: |
          # Job timeout 350 menit.
          # Loop 330 menit agar ada waktu untuk cleanup.
          $endTime = (Get-Date).AddMinutes(330)

          while ((Get-Date) -lt $endTime) {
            $remaining = [math]::Ceiling(
              ($endTime - (Get-Date)).TotalMinutes
            )

            Write-Host ""
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')]"
            Write-Host "RDP masih aktif."
            Write-Host "Sisa waktu sekitar $remaining menit."

            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $tailscaleCandidates = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          $tailscale = $tailscaleCandidates |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          # Matikan RDP terlebih dahulu
          $terminalServerPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"

          Set-ItemProperty `
            -Path $terminalServerPath `
            -Name "fDenyTSConnections" `
            -Value 1 `
            -Force

          Restart-Service `
            -Name TermService `
            -Force

          # Putuskan koneksi Tailscale
          if ($tailscale) {
            & $tailscale logout
          }

          # Hapus firewall rule custom
          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -ErrorAction SilentlyContinue

          # Hapus user sementara
          Remove-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup selesai."
