name: Tailscale-RDP

on:
  workflow_dispatch:

concurrency:
  group: tailscale-rdp-${{ github.repository }}
  cancel-in-progress: true

permissions: {}

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      RDP_USERNAME: egandika
      TAILSCALE_HOSTNAME: gh-rdp-${{ github.run_id }}

    steps:
      - name: Validate secrets
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { throw "Secret RDP_PASSWORD belum dibuat." }
          if ($env:RDP_PASSWORD.Length -lt 16) { throw "RDP_PASSWORD minimal 16 karakter." }
          if ($env:RDP_PASSWORD -notmatch '[A-Z]') { throw "RDP_PASSWORD harus memiliki huruf besar." }
          if ($env:RDP_PASSWORD -notmatch '[a-z]') { throw "RDP_PASSWORD harus memiliki huruf kecil." }
          if ($env:RDP_PASSWORD -notmatch '\d') { throw "RDP_PASSWORD harus memiliki angka." }
          if ($env:RDP_PASSWORD -notmatch '[^a-zA-Z0-9]') { throw "RDP_PASSWORD harus memiliki simbol." }
          if ($env:RDP_PASSWORD -match 'egandika') { throw "RDP_PASSWORD tidak boleh mengandung username." }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) { throw "Secret TAILSCALE_AUTH_KEY belum dibuat." }

      - name: Configure RDP and firewall
        shell: pwsh
        run: |
          $terminalServerPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpTcpPath = "$terminalServerPath\WinStations\RDP-Tcp"
          $firewallRuleName = "RDP-Tailscale-Only"
          Set-ItemProperty -Path $terminalServerPath -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path $rdpTcpPath -Name "UserAuthentication" -Value 1 -Force
          Get-NetFirewallRule -ErrorAction SilentlyContinue | Where-Object { $_.DisplayGroup -eq "Remote Desktop" } | Disable-NetFirewallRule -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName $firewallRuleName -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName $firewallRuleName -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress "100.64.0.0/10" -Action Allow -Profile Any
          Restart-Service -Name TermService -Force

      - name: Create RDP Administrator user
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $rdpGroup = Get-LocalGroup -SID "S-1-5-32-555" -ErrorAction Stop
          $adminGroup = Get-LocalGroup -Name "Administrators" -ErrorAction Stop

          $existingUser = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
          if ($null -eq $existingUser) {
            New-LocalUser -Name $env:RDP_USERNAME -Password $securePassword -AccountNeverExpires -PasswordNeverExpires -UserMayNotChangePassword -Description "Temporary RDP Admin"
          } else { Set-LocalUser -Name $env:RDP_USERNAME -Password $securePassword }

          Enable-LocalUser -Name $env:RDP_USERNAME

          $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction Stop

          # Add to Remote Desktop Users
          $membersRDP = Get-LocalGroupMember -Group $rdpGroup.Name -ErrorAction SilentlyContinue
          $isMemberRDP = @($membersRDP | Where-Object { $_.SID.Value -eq $user.SID.Value }).Count -gt 0
          if (-not $isMemberRDP) { Add-LocalGroupMember -Group $rdpGroup.Name -Member $env:RDP_USERNAME }

          # Add to Administrators
          $membersAdmin = Get-LocalGroupMember -Group $adminGroup.Name -ErrorAction SilentlyContinue
          $isMemberAdmin = @($membersAdmin | Where-Object { $_.SID.Value -eq $user.SID.Value }).Count -gt 0
          if (-not $isMemberAdmin) { Add-LocalGroupMember -Group $adminGroup.Name -Member $env:RDP_USERNAME }

          Write-Host "User Administrator siap: $env:RDP_USERNAME"

      - name: Install Tailscale
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "tailscale-setup.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installer
          if (-not (Test-Path $installer)) { throw "Installer Tailscale gagal didownload." }
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", $installer, "/qn", "/norestart") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Instalasi Tailscale gagal. Exit code: $($process.ExitCode)" }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) { throw "tailscale.exe tidak ditemukan." }
          & $tailscale up "--auth-key=$env:TAILSCALE_AUTH_KEY" "--hostname=$env:TAILSCALE_HOSTNAME" "--accept-dns=false" "--accept-routes=false"
          if ($LASTEXITCODE -ne 0) { throw "Gagal menghubungkan Tailscale." }
          Start-Sleep -Seconds 5
          $ip = & $tailscale ip -4 | Select-Object -First 1
          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP SIAP DIGUNAKAN"
          Write-Host "IP : $ip"
          Write-Host "Port : 3389"
          Write-Host "Username : $env:RDP_USERNAME"
          Write-Host "Password : gunakan secret RDP_PASSWORD"
          Write-Host "Role : Administrator"
          Write-Host "UAC : MATI"
          Write-Host "======================================"
          @"
          ## RDP Siap Digunakan
          - **IP:** $ip
          - **Port:** 3389
          - **Username:** $env:RDP_USERNAME
          - **Password:** gunakan secret RDP_PASSWORD
          - **Role:** Administrator
          - **UAC:** Mati
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Disable UAC Permanently
        shell: pwsh
        run: |
          Write-Host "Mematikan UAC permanen..."
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" "EnableLUA" 0
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" "ConsentPromptBehaviorAdmin" 0
          Set-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System" "PromptOnSecureDesktop" 0

      - name: Keep runner alive
        shell: pwsh
        run: |
          $endTime = (Get-Date).AddMinutes(330)
          while ((Get-Date) -lt $endTime) {
            $remaining = [math]::Ceiling(($endTime - (Get-Date)).TotalMinutes)
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP masih aktif. Sisa waktu sekitar $remaining menit."
            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          # UAC TETAP MATI
          Set-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" "fDenyTSConnections" 1 -Force
          Restart-Service -Name TermService -Force
          & "$env:ProgramFiles\Tailscale\tailscale.exe" logout -ErrorAction SilentlyContinue
          Remove-NetFirewallRule -DisplayName "RDP-Tailscale-Only" -ErrorAction SilentlyContinue
          Remove-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Write-Host "Cleanup selesai."
